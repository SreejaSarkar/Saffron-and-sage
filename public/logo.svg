<svg width="520" height="160" viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saffron &amp; Sage">
  <title>Saffron &amp; Sage</title>

  <!-- Emblem -->
  <g transform="translate(16 16)">
    <circle cx="64" cy="64" r="62" fill="#fbf7f0" stroke="#b6833a" stroke-width="3"/>
    <circle cx="64" cy="64" r="54" fill="none" stroke="#ece3d6" stroke-width="1.5"/>

    <!-- Sage sprig -->
    <g stroke="#3f5d4a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M64 108 C64 86 64 66 64 40"/>
      <path d="M64 58 C52 52 44 54 38 44"/>
      <path d="M64 58 C76 52 84 54 90 44"/>
      <path d="M64 78 C52 72 44 74 40 65"/>
      <path d="M64 78 C76 72 84 74 88 65"/>
    </g>
    <g fill="#3f5d4a">
      <path d="M38 44 C30 40 26 33 27 26 C35 26 42 31 44 39 Z"/>
      <path d="M90 44 C98 40 102 33 101 26 C93 26 86 31 84 39 Z"/>
      <path d="M40 65 C33 62 29 56 30 50 C37 50 43 54 45 61 Z"/>
      <path d="M88 65 C95 62 99 56 98 50 C91 50 85 54 83 61 Z"/>
    </g>

    <!-- Saffron threads / crocus at the crown -->
    <g stroke="#b6833a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M64 40 C60 30 58 24 62 16"/>
      <path d="M64 40 C64 29 64 23 64 15"/>
      <path d="M64 40 C68 30 70 24 66 16"/>
    </g>
    <circle cx="62" cy="16" r="2.6" fill="#8c6026"/>
    <circle cx="64" cy="15" r="2.6" fill="#8c6026"/>
    <circle cx="66" cy="16" r="2.6" fill="#8c6026"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150 0)" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="78" font-size="46" font-weight="700" fill="#2a2622" letter-spacing="0.5">Saffron</text>
    <text x="0" y="128" font-size="46" font-weight="700" fill="#2a2622" letter-spacing="0.5">
      <tspan fill="#b6833a" font-style="italic">&amp;</tspan><tspan dx="10">Sage</tspan>
    </text>
    <text x="2" y="150" font-size="13" fill="#3f5d4a" letter-spacing="4" font-family="Arial, Helvetica, sans-serif">MODERN MEDITERRANEAN</text>
  </g>
